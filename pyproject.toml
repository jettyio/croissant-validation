[project]
name = "croissant-validation-mcp"
version = "0.2.0"
description = "Stateless MCP server (spec 2026-07-28) for validating MLCommons Croissant dataset metadata"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp==2.0.0",
    "mlcroissant==1.1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
